format = 1
product_id = "xocs"

[foundation]
platform_generation = 1
version = "1.0.9"
git_rev = "c51ef3ac43c10314b091f0415ce1aebea7470a47"

# Source policy scans the whole product tree, including src and web.
# Public blog and anonymous interactions remain owned by Xocs, alongside its admin UI.
[[components]]
id = "server"
profile = "server-control-plane"
http_adapter = "axum"
web_profile = "web-react-admin"
capabilities = [
  "embedded-web",
  "platform-sqlite",
  "admin-persistent",
  "server-runtime",
  "server-health",
  "secure-http",
]
