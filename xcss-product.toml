format = 1
product_id = "xocs"

[foundation]
platform_generation = 1
version = "1.0.0"
git_rev = "6d285cd1ba4707ed2350123d7b50dfeacfb7a4ac"

# Source policy scans the whole product tree, including src and web.
# Public blog and anonymous interactions remain owned by Xocs, alongside its admin UI.
[[components]]
id = "server"
profile = "server-control-plane"
http_adapter = "axum"
web_profile = "web-csr-admin"
capabilities = [
  "embedded-web",
  "platform-sqlite",
  "admin-persistent",
  "server-runtime",
  "server-health",
  "secure-http",
]
