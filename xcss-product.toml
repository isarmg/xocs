format = 1
product_id = "xocs"

[foundation]
platform_generation = 1
version = "1.0.0"
git_rev = "b34b3861e15edd2b1348e7d03b9c9a93e97d6521"

# Source policy scans the whole product tree, including src and web.
# Public blog and anonymous interactions remain owned by Xocs, alongside its admin UI.
[[components]]
id = "server"
profile = "server-control-plane"
http_adapter = "axum"
web_profile = "web-react-admin"
capabilities = [
  "embedded-web",
  "platform-sqlite",
  "admin-persistent",
  "server-runtime",
  "server-health",
  "secure-http",
]
