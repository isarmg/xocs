format = 1
product_id = "xocs"

[foundation]
platform_generation = 1
version = "1.0.1"
git_rev = "fd90ca39b8f03359a0ba92e182f7d84bc7c1a315"

# Source policy scans the whole product tree, including src and web.
# Public blog and anonymous interactions remain owned by Xocs, alongside its admin UI.
[[components]]
id = "server"
profile = "server-control-plane"
http_adapter = "axum"
web_profile = "web-react-admin"
capabilities = [
  "embedded-web",
  "platform-sqlite",
  "admin-persistent",
  "server-runtime",
  "server-health",
  "secure-http",
]
