[package]
name = "xocs"
version = "1.0.5"
edition = "2024"
rust-version = "1.99"
publish = false
build = "build.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
percent-encoding = "2"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio", "chrono", "json", "derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"
xcss = { git = "https://github.com/isarmg/xcss.git", rev = "b9b5858088510d0bf6832044353c92d09ee123fe", version = "=1.0.13", features = ["tracing"] }

[build-dependencies]
sha2 = "0.11"
serde_json = "1"
xcss = { git = "https://github.com/isarmg/xcss.git", rev = "b9b5858088510d0bf6832044353c92d09ee123fe", version = "=1.0.13" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "deny"

[workspace]
resolver = "3"
