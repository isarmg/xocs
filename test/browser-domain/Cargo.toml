[package]
rust-version = "1.99"
name = "blog-browser-domain-tests"
edition = "2024"
publish = false
description = "浏览器数据契约与Markdown逻辑的宿主测试"
build = "../../src/tools/assets/src/platform_contract.rs"

[lib]
path = "lib.rs"
name = "blog_browser_domain_tests"

[dependencies]
serde = {  features = ["derive"], path = "../../src/foundation/format/data-model",package = "blog-format-data-model"}
serde_json = { path = "../../src/foundation/format/json",package = "blog-format-json"}
pulldown-cmark = {  default-features = false, features = ["html"], path = "../../src/foundation/assets/markdown-parser",package = "blog-assets-markdown-parser"}

[dependencies.url-encoding]
path = "../../src/foundation/network/web-address"
package = "blog-network-web-address"
default-features = true
features = [
    "parser",
    "std",
]

[lints]
workspace = true
