name: CI

on:
  push:
  pull_request:

permissions: {}

# Superseded branch/PR CI can stop; release and manual runs stay independent.
concurrency:
  group: blog-ci-${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')) }}

env:
  RUSTUP_TOOLCHAIN: 1.99.0

jobs:
  server-and-smoke:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false
      - name: Validate parallel CI gates and release staging
        run: |
          node --test scripts/check-ci-parallelism.test.mjs
          python3 -I -B scripts/test-installed-candidate-workflow.py
          python3 -I -B scripts/test-installed-lifecycle-adapter.py
          python3 -I -B scripts/test-package-release.py
      - name: Check repository documentation
        run: |
          python3 -I -B tools/test-docs.py
          python3 tools/rust-sources/docs.py --check
          python3 tools/check-docs.py
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Verify repository-owned implementation
        run: |
          python3 tools/test-independence.py
          python3 -I -B tools/rust-sources/test_manage.py
          python3 -I -B tools/rust-sources/test_audit.py
          python3 tools/rust-sources/manage.py verify --metadata
          python3 tools/check-independence.py

      - name: Build web from repository Rust sources
        run: cargo run --quiet --locked --offline -p blog-assets -- build --product-root . --offline
      - name: Build native and browser API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --offline -p blog -p blog-setup -p blog-assets
          cargo doc --locked --offline -p blog-browser --target wasm32-unknown-unknown
      - name: Prepare browser test dependencies
        working-directory: web
        run: npm ci
      - name: Check and build server
        run: |
          cargo fmt -p blog -p blog-application -p blog-setup -p blog-assets -p blog-browser -p blog-browser-domain-tests -p blog-interface -p blog-dom -p blog-component-macros -- --check
          cargo clippy --locked --offline --all-targets -- -D warnings
          cargo clippy --locked --offline -p blog-assets -p blog-browser-domain-tests --all-targets -- -D warnings
          cargo clippy --locked --offline -p blog-browser --target wasm32-unknown-unknown -- -D warnings
          cargo test --locked --offline
          cargo test --locked --offline -p blog-assets -p blog-browser-domain-tests
          bash scripts/test-maintained.sh
          cargo run --quiet --locked --offline -p blog-assets -- test --product-root . --offline
          cargo build --locked --offline
      - name: Install browsers
        working-directory: web
        run: npx playwright install --with-deps chromium firefox
      - name: End-to-end smoke test
        run: bash scripts/smoke.sh

  browser:
    name: Browser (${{ matrix.group }})
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [admin, public]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false
      - name: Install exact browser Rust tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Build web from repository Rust sources
        run: cargo run --quiet --locked --offline -p blog-assets -- build --product-root . --offline
      - name: Prepare browser test dependencies
        working-directory: web
        run: npm ci
      - name: Install browsers
        working-directory: web
        run: npx playwright install --with-deps chromium firefox
      - name: Bilingual layouts and anonymous interactions
        working-directory: web
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          case "$TEST_GROUP" in
            admin)
              npm run test:unit
              node tests/language.mjs
              node tests/admin-layout.mjs
              node tests/account-settings.mjs
              node tests/admin-cleanup.mjs
              node tests/management.mjs
              node tests/contract-fixes.mjs
              node tests/blog-interface-runtime.mjs
              node tests/async-state.mjs
              node tests/transport-lifecycle.mjs
              node tests/startup-failure.mjs
              node tests/rust-native-domain.mjs
              ;;
            public)
              node tests/public-footer.mjs
              node tests/public-layout.mjs
              node tests/anonymous-comments.mjs
              ;;
            *) exit 1 ;;
          esac

  build-and-smoke:
    needs: [server-and-smoke, browser, installed_candidate]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every server and browser check
        env:
          SERVER_RESULT: ${{ needs.server-and-smoke.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          INSTALLED_RESULT: ${{ needs.installed_candidate.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SERVER_RESULT" == success && "$BROWSER_RESULT" == success && "$INSTALLED_RESULT" == success ]]

  installed_candidate:
    name: Independent installed candidate
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SERVER_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false
      - name: Install exact Rust tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          CARGO_NET_OFFLINE=false cargo install cargo-audit --version 0.22.2 --locked
          CARGO_NET_OFFLINE=false cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Verify local packaging boundaries
        run: |
          python3 tools/rust-sources/manage.py verify --metadata
          python3 tools/check-independence.py
          python3 -I -B scripts/test-installed-candidate-workflow.py
          python3 -I -B scripts/test-installed-lifecycle-adapter.py
          python3 -I -B scripts/test-package-release.py
      - name: Build source-bound candidate from this checkout
        env:
          BLOG_BUILD_METADATA_DIR: ${{ runner.temp }}/blog-metadata
          BLOG_FRONTEND_METADATA_FILE: ${{ runner.temp }}/blog-metadata/frontend.json
          BLOG_SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir -m 0700 "$BLOG_BUILD_METADATA_DIR"
          cargo run --quiet --locked --offline -p blog-assets -- server --product-root . --config blog-assets.json --mode candidate --source-revision "$GITHUB_SHA" --offline
          "$CARGO_TARGET_DIR/$SERVER_TARGET/release/blog" --version | grep -F 'blog '
      - name: Audit original identities of maintained Rust sources
        run: python3 tools/rust-sources/audit.py
      - name: Stage independently installable candidate
        run: |
          bash scripts/package-installed-candidate.sh \
            "$CARGO_TARGET_DIR/$SERVER_TARGET/release/blog" \
            "$RUNNER_TEMP/blog-metadata" "$RUNNER_TEMP/blog-candidate"
      - name: Exercise local installation and maintenance
        env:
          BLOG_INSTALL_DIAGNOSTICS: ${{ runner.temp }}/blog-install-diagnostics
        run: |
          set -euo pipefail
          candidates=("$RUNNER_TEMP/blog-candidate"/blog-*-linux-x86_64.tar.gz)
          [[ ${#candidates[@]} == 1 && -f "${candidates[0]}" ]]
          sudo --preserve-env=BLOG_INSTALL_DIAGNOSTICS bash scripts/check-installed-candidate.sh "${candidates[0]}"
      - name: Hand redacted diagnostics to the artifact runner
        if: ${{ always() }}
        env:
          BLOG_INSTALL_DIAGNOSTICS: ${{ runner.temp }}/blog-install-diagnostics
        run: |
          if sudo test -d "$BLOG_INSTALL_DIAGNOSTICS"; then
            sudo chown -R -- "$(id -u):$(id -g)" "$BLOG_INSTALL_DIAGNOSTICS"
          fi
      - name: Retain redacted installation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blog-installed-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/blog-install-diagnostics
          if-no-files-found: ignore
          retention-days: 3
