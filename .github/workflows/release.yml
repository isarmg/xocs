name: Release Linux x86_64

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  RUSTUP_TOOLCHAIN: 1.99.0

jobs:
  release:
    name: Verify, package and publish
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown

      - name: Install exact supply-chain tools
        run: |
          CARGO_NET_OFFLINE=false cargo install cargo-audit --version 0.22.2 --locked

      - name: Verify repository-owned implementation
        run: |
          python3 test/check-layout.py
          python3 -I -B test/tools/test-layout.py
          python3 -I -B test/tools/test-docs.py
          python3 src/tools/check-docs.py
          python3 src/tools/rust-sources/docs.py --check
          python3 test/tools/test-independence.py
          python3 -I -B test/tools/rust-sources/test_manage.py
          python3 -I -B test/tools/rust-sources/test_audit.py
          python3 src/tools/rust-sources/manage.py verify --metadata
          python3 src/tools/check-independence.py

      - name: Build web from repository Rust sources
        run: cargo run --quiet --locked --offline -p blog-assets -- build --product-root . --offline
      - name: Build native and browser API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --offline -p blog -p blog-setup -p blog-assets
          cargo doc --locked --offline -p blog-browser --target wasm32-unknown-unknown
      - name: Prepare browser test dependencies
        working-directory: src/web
        run: npm ci
      - name: Verify and build server
        run: |
          cargo fmt -p blog -p blog-application -p blog-setup -p blog-assets -p blog-browser -p blog-browser-domain-tests -p blog-interface -p blog-dom -p blog-component-macros -- --check
          cargo clippy --locked --offline --all-targets -- -D warnings
          cargo clippy --locked --offline -p blog-assets -p blog-browser-domain-tests --all-targets -- -D warnings
          cargo clippy --locked --offline -p blog-browser --target wasm32-unknown-unknown -- -D warnings
          cargo test --locked --offline
          cargo test --locked --offline -p blog-assets -p blog-browser-domain-tests
          bash test/run-maintained.sh
          cargo run --quiet --locked --offline -p blog-assets -- test --product-root . --offline
          export BLOG_SOURCE_REVISION="$(git rev-parse HEAD)"
          test "$BLOG_SOURCE_REVISION" = "${GITHUB_SHA}"
          cargo run --quiet --locked --offline -p blog-assets -- server --product-root . \
            --config blog-assets.json --mode release \
            --rust-only --source-revision "$BLOG_SOURCE_REVISION" --offline

      - name: Install browsers
        working-directory: src/web
        run: npx playwright install --with-deps chromium firefox

      - name: Verify bilingual layouts and anonymous interactions
        working-directory: src/web
        run: |
          npm run test:unit
          node ../../test/browser/language.mjs
          node ../../test/browser/admin-layout.mjs
          node ../../test/browser/configured-media.mjs
          node ../../test/browser/account-settings.mjs
          node ../../test/browser/admin-cleanup.mjs
          node ../../test/browser/management.mjs
          node ../../test/browser/contract-fixes.mjs
          node ../../test/browser/blog-interface-runtime.mjs
          node ../../test/browser/async-state.mjs
          node ../../test/browser/transport-lifecycle.mjs
          node ../../test/browser/startup-failure.mjs
          node ../../test/browser/rust-native-domain.mjs
          node ../../test/browser/public-footer.mjs
          node ../../test/browser/public-layout.mjs
          node ../../test/browser/anonymous-comments.mjs

      - name: End-to-end smoke test
        env:
          BLOG_SMOKE_BINARY: ${{ github.workspace }}/target/x86_64-unknown-linux-gnu/release/blog
          BLOG_SMOKE_MANAGED_CONFIG: 1
        run: bash test/operations/smoke.sh

      - name: Audit original identities of maintained Rust sources
        run: python3 src/tools/rust-sources/audit.py

      - name: Package Linux x86_64 distribution
        run: |
          mkdir -p dist
          bash src/operations/package-linux-x86_64.sh --output-dir "$GITHUB_WORKSPACE/dist"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blog-${{ github.ref_name }}-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "Blog ${GITHUB_REF_NAME}"
