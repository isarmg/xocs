name: Release Linux x86_64

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  RUSTUP_TOOLCHAIN: 1.99.0

jobs:
  release:
    name: Verify, package and publish
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          cargo +1.99.0 install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Install exact supply-chain tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Verify pinned xcss contracts
        run: |
          xcss_input="$RUNNER_TEMP/xocs-xcss-input"
          git init --quiet "$xcss_input"
          git -C "$xcss_input" remote add origin https://github.com/isarmg/xcss.git
          git -C "$xcss_input" fetch --depth=1 origin d9f6f2a900d85eac0bb8c53575ccd4ca09890514
          git -C "$xcss_input" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$xcss_input" rev-parse HEAD)" = d9f6f2a900d85eac0bb8c53575ccd4ca09890514
          python3 "$xcss_input/scripts/xcss-conformance.py" verify-manifest --product-root "$GITHUB_WORKSPACE"
          python3 "$xcss_input/scripts/xcss-conformance.py" verify-source --product-root "$GITHUB_WORKSPACE"

      - name: Build web
        working-directory: web
        run: |
          npm ci
          cargo +1.99.0 run --quiet --locked --manifest-path ../tools/web-build/Cargo.toml -- build --product-root ..
      - name: Verify and build server
        run: |
          cargo fmt --all -- --check
          cargo +1.99.0 fmt --manifest-path tools/web-build/Cargo.toml -- --check
          cargo +1.99.0 clippy --manifest-path tools/web-build/Cargo.toml --locked --all-targets -- -D warnings
          cargo +1.99.0 fmt --manifest-path web/xcss-web/Cargo.toml -- --check
          cargo +1.99.0 clippy --manifest-path web/xcss-web/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings
          cargo +1.99.0 run --quiet --locked --manifest-path tools/web-build/Cargo.toml -- test --product-root .
          cargo +1.99.0 test --locked --manifest-path web/xcss-web/domain-tests/Cargo.toml
          cargo +1.99.0 test --locked --manifest-path tools/web-build/Cargo.toml
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          export XOCS_SOURCE_REVISION="$(git rev-parse HEAD)"
          test "$XOCS_SOURCE_REVISION" = "${GITHUB_SHA}"
          cargo +1.99.0 run --quiet --locked --manifest-path tools/web-build/Cargo.toml -- server --product-root . \
            --config xcss-web-build.json --mode release \
            --rust-only --source-revision "$XOCS_SOURCE_REVISION"

      - name: Install browsers
        working-directory: web
        run: npx playwright install --with-deps chromium firefox

      - name: Verify bilingual layouts and anonymous interactions
        working-directory: web
        run: |
          npm run test:unit
          node tests/language.mjs
          node tests/admin-layout.mjs
          node tests/account-settings.mjs
          node tests/admin-cleanup.mjs
          node tests/management.mjs
          node tests/contract-fixes.mjs
          node tests/xcss-web-runtime.mjs
          node tests/async-state.mjs
          node tests/rust-native-domain.mjs
          node tests/public-footer.mjs
          node tests/public-layout.mjs
          node tests/anonymous-comments.mjs

      - name: End-to-end smoke test
        env:
          XOCS_SMOKE_BINARY: ${{ github.workspace }}/target/x86_64-unknown-linux-gnu/release/xocs
          XOCS_SMOKE_MANAGED_CONFIG: 1
        run: bash scripts/smoke.sh

      - name: Audit the independent xcss-web lockfile
        run: cargo audit --file web/xcss-web/Cargo.lock --deny yanked

      - name: Package Linux x86_64 distribution
        run: |
          mkdir -p dist
          bash scripts/package-linux-x86_64.sh --output-dir "$GITHUB_WORKSPACE/dist"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xocs-${{ github.ref_name }}-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" \
            --title "Xocs ${GITHUB_REF_NAME}"
