name: Release Linux x86_64

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  RUSTUP_TOOLCHAIN: 1.99.0

jobs:
  release:
    name: Verify, package and publish
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy

      - name: Install exact supply-chain tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Verify pinned xcss contracts
        run: |
          xcss_input="$RUNNER_TEMP/xocs-xcss-input"
          git init --quiet "$xcss_input"
          git -C "$xcss_input" remote add origin https://github.com/isarmg/xcss.git
          git -C "$xcss_input" fetch --depth=1 origin b9b5858088510d0bf6832044353c92d09ee123fe
          git -C "$xcss_input" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$xcss_input" rev-parse HEAD)" = b9b5858088510d0bf6832044353c92d09ee123fe
          python3 "$xcss_input/scripts/xcss-conformance.py" verify-manifest --product-root "$GITHUB_WORKSPACE"
          python3 "$xcss_input/scripts/xcss-conformance.py" verify-source --product-root "$GITHUB_WORKSPACE"

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify and build server
        run: |
          export XOCS_SOURCE_REVISION="$(git rev-parse HEAD)"
          test "$XOCS_SOURCE_REVISION" = "${GITHUB_SHA}"
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          web/node_modules/.bin/xcss-build-server \
            --config xcss-web-build.json --mode release --no-install \
            --rust-only --source-revision "$XOCS_SOURCE_REVISION"

      - name: Install browsers
        working-directory: web
        run: npx playwright install --with-deps chromium firefox

      - name: Verify bilingual layouts and anonymous interactions
        working-directory: web
        run: |
          npm run test:unit
          node tests/language.mjs
          node tests/admin-layout.mjs
          node tests/account-settings.mjs
          node tests/admin-cleanup.mjs
          node tests/management.mjs
          node tests/public-footer.mjs
          node tests/public-layout.mjs
          node tests/anonymous-comments.mjs

      - name: End-to-end smoke test
        env:
          XOCS_SMOKE_BINARY: ${{ github.workspace }}/target/x86_64-unknown-linux-gnu/release/xocs
        run: bash scripts/smoke.sh

      - name: Package Linux x86_64 distribution
        env:
          XSSI_SIGNING_KEY_PEM: ${{ secrets.XSSI_SIGNING_KEY_PEM }}
          XSSI_REPOSITORY_TOKEN: ${{ secrets.XSSI_REPOSITORY_TOKEN }}
        run: |
          test -n "$XSSI_SIGNING_KEY_PEM"
          key="$RUNNER_TEMP/xocs-release-signing.pem"
          umask 077
          printf '%s\n' "$XSSI_SIGNING_KEY_PEM" > "$key"
          trap 'rm -f -- "$key"' EXIT
          mkdir -p dist
          bash scripts/package-linux-x86_64.sh --output-dir "$GITHUB_WORKSPACE/dist" --signing-key "$key"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xocs-${{ github.ref_name }}-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" \
            --title "Xocs ${GITHUB_REF_NAME}"
