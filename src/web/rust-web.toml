[web]
# Optional bundled public files; cap 8 MiB total / 4 MiB each.
public_assets_manifest = "public-assets.json"
kind = "spa"
entry = "src/main.js"
dist = "src/web/dist"
base = "/"

[web.proxies]
"/api" = "http://127.0.0.1:8081"

[aliases]
"@blog/styles/" = "styles/"

# Preserve original notices in standalone dist as well as release receipts.
[web.copies]
"assets/LICENSE-blog-dom-MIT.txt" = "licenses/LICENSE-blog-dom-MIT.txt"
"assets/LICENSE-blog-component-macros-MIT.txt" = "licenses/LICENSE-blog-component-macros-MIT.txt"
"assets/LICENSE-blog-Apache-2.0.txt" = "styles/LICENSE"
