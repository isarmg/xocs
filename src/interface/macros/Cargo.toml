[package]
name = "blog-component-macros"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
autotests = false
autobenches = false
description = "CSR component, typed props and identifier compilation"

[lib]
name = "blog_component_macros"
path = "src/lib.rs"
proc-macro = true

[features]
default = ["csr"]
csr = []

[dependencies.proc-macro2]
package = "blog-syntax-token-stream"
path = "../../foundation/syntax/token-stream"

[dependencies.quote]
package = "blog-syntax-token-templates"
path = "../../foundation/syntax/token-templates"

[dependencies.syn]
package = "blog-syntax-rust-parser"
path = "../../foundation/syntax/rust-parser"
features = ["full", "visit-mut", "extra-traits"]

[dependencies.syn_legacy]
package = "blog-syntax-record-derive-parser"
path = "../../foundation/syntax/record-derive-parser"
features = ["full", "extra-traits"]

[dependencies.unicode-segmentation]
package = "blog-text-text-boundaries"
path = "../../foundation/text/text-boundaries"
