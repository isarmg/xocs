# Project-owned consolidation; immutable upstream origins remain in compliance.
[package]
edition = "2021"
rust-version = "1.63"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
license = "MIT"
name = "blog-network-http-transport"
publish = false
description = "http transport"

[features]
client = [
    "dep:want",
    "dep:pin-project-lite",
    "dep:smallvec",
]
default = []
full = [
    "client-legacy",
    "server-auto",
    "service-adapter",
    "tokio",
    "adapter-tracing",
]
http1 = [
    "dep:atomic-waker",
    "dep:futures",
    "futures/std",
    "dep:httparse",
    "dep:itoa",
]
nightly = []
server = [
    "dep:httpdate",
    "dep:pin-project-lite",
    "dep:smallvec",
]
tracing = [
    "dep:tracing",
]
__internal_happy_eyeballs_tests = [
    "adapters",
]
adapter-client = [
    "client",
    "dep:tracing",
    "dep:futures",
    "futures/channel",
    "futures/std",
    "dep:service-stack",
    "adapters",
]
client-legacy = [
    "adapter-client",
    "tokio/net",
    "dep:socket2",
    "tokio/sync",
    "dep:libc",
    "dep:futures",
    "futures/alloc",
    "futures/utilities",
    "dep:httparse",
]
rt-tracing-exec-force = [
    "tokio",
    "adapter-tracing",
]
adapter-server = [
    "server",
    "adapters",
]
server-auto = [
    "adapter-server",
    "http1",
]
service-adapter = [
    "dep:service-stack",
    "adapters",
]
tokio = [
    "tokio/rt",
    "tokio/time",
    "adapters",
]
adapter-tracing = [
    "dep:tracing",
    "adapters",
]
adapters = [
    "dep:pin-project-lite",
]

[lib]
name = "http_transport"
path = "src/lib.rs"
doctest = false

[lints.clippy]
absolute_paths = "allow"
arbitrary_source_item_ordering = "allow"
arithmetic_side_effects = "allow"
as_conversions = "allow"
blanket_clippy_restriction_lints = "allow"
cast_precision_loss = "allow"
checked_conversions = "allow"
clone_on_ref_ptr = "allow"
cognitive_complexity = "allow"
decimal_literal_representation = "allow"
default_numeric_fallback = "allow"
definition_in_module_root = "allow"
else_if_without_else = "allow"
error_impl_error = "allow"
expect_used = "allow"
field_scoped_visibility_modifiers = "allow"
float_arithmetic = "allow"
if_not_else = "allow"
if_then_some_else_none = "allow"
impl_trait_in_params = "allow"
implicit_return = "allow"
indexing_slicing = "allow"
inline_modules = "allow"
inline_trait_bounds = "allow"
items_after_statements = "allow"
let_underscore_must_use = "allow"
let_underscore_untyped = "allow"
let_unit_value = "allow"
match_wild_err_arm = "allow"
min_ident_chars = "allow"
missing_assert_message = "allow"
missing_docs_in_private_items = "allow"
missing_inline_in_public_items = "allow"
missing_trait_methods = "allow"
mod_module_files = "allow"
module_inception = "allow"
module_name_repetitions = "allow"
multiple_inherent_impl = "allow"
multiple_unsafe_ops_per_block = "allow"
must_use_candidate = "allow"
needless_bool = "allow"
needless_pass_by_value = "allow"
new_without_default = "allow"
panic_in_result_fn = "allow"
pattern_type_mismatch = "allow"
pub_use = "allow"
pub_with_shorthand = "allow"
question_mark_used = "allow"
redundant_closure_for_method_calls = "allow"
redundant_else = "allow"
renamed_function_params = "allow"
rest_pattern_accessible_field = "allow"
same_name_method = "allow"
self_named_module_files = "deny"
semicolon_inside_block = "allow"
semicolon_outside_block = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
shadow_unrelated = "allow"
single_call_fn = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
type_complexity = "allow"
unnecessary_rest_pattern = "allow"
unnecessary_safety_comment = "allow"
unnested_or_patterns = "allow"
unreachable = "allow"
unseparated_literal_suffix = "allow"
unused_async = "allow"
unused_trait_names = "allow"
unwrap_in_result = "allow"
used_underscore_items = "allow"
wildcard_enum_match_arm = "allow"

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.clippy.restriction]
level = "warn"
priority = -2

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(hyper_unstable_tracing)",
]

[dependencies.atomic-waker]
optional = true
path = "../../runtime/task-waker"
package = "blog-runtime-task-waker"

[dependencies.bytes]
path = "../../encoding/byte-buffer"
package = "blog-encoding-byte-buffer"

[dependencies.http]
path = "../http-message"
package = "blog-network-http-message"

[dependencies.http-body]
path = "../body-stream"
package = "blog-network-body-stream"

[dependencies.httparse]
optional = true
path = "../http-parser"
package = "blog-network-http-parser"

[dependencies.httpdate]
optional = true
path = "../http-date"
package = "blog-network-http-date"

[dependencies.itoa]
optional = true
path = "../../encoding/integer-format"
package = "blog-encoding-integer-format"

[dependencies.pin-project-lite]
optional = true
path = "../../sync/pinned-projection"
package = "blog-sync-pinned-projection"

[dependencies.smallvec]
features = [
    "const_generics",
    "const_new",
]
optional = true
path = "../../collections/inline-vector"
package = "blog-collections-inline-vector"

[dependencies.tokio]
features = [
    "sync",
]
path = "../../runtime/task-scheduler"
package = "blog-runtime-task-scheduler"

[dependencies.tracing]
features = [
    "std",
]
optional = true
default-features = false
path = "../../diagnostics/structured-events"
package = "blog-diagnostics-structured-events"

[dependencies.want]
optional = true
path = "../../runtime/readiness-signal"
package = "blog-runtime-readiness-signal"



[dependencies.libc]
optional = true
path = "../../platform/system-abi"
package = "blog-platform-system-abi"

[dependencies.socket2]
features = [
    "all",
]
optional = true
path = "../../platform/socket-options"
package = "blog-platform-socket-options"

[dependencies.futures]
path = "../../runtime/async-toolkit"
default-features = false
optional = true
package = "blog-runtime-async-toolkit"

[dependencies.service-stack]
path = "../request-pipeline"
default-features = false
optional = true
package = "blog-network-request-pipeline"
