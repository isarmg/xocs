# Project-owned consolidation; immutable upstream origins remain in compliance.
[package]
edition = "2018"
rust-version = "1.64.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
license = "MIT"
name = "blog-network-request-pipeline"
publish = false
description = "request pipeline"

[features]
log = ["tracing/log"]
make = ["pin-project-lite", "tokio"]
util = ["dep:futures", "futures/std", "futures/alloc", "futures/utilities", "pin-project-lite", "sync_wrapper"]

[lib]
name = "service_stack"
path = "src/lib.rs"
doctest = false

[dependencies.futures]
path = "../../runtime/async-toolkit"
default-features = false
optional = true
package = "blog-runtime-async-toolkit"


[dependencies.pin-project-lite]
optional = true
path = "../../sync/pinned-projection"
package = "blog-sync-pinned-projection"


[dependencies.sync_wrapper]
optional = true
path = "../../sync/exclusive-value"
package = "blog-sync-exclusive-value"

[dependencies.tokio]
optional = true
path = "../../runtime/task-scheduler"
package = "blog-runtime-task-scheduler"

[dependencies.tracing]
features = [
    "std",
]
optional = true
default-features = false
path = "../../diagnostics/structured-events"
package = "blog-diagnostics-structured-events"
