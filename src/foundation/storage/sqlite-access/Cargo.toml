[package]
edition = "2021"
rust-version = "1.94.0"
name = "blog-storage-sqlite-access"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "sqlite access"
license = "MIT OR Apache-2.0"
publish = false

[features]
chrono = ["dep:chrono"]
default = []
derive = ["dep:sqlx-macros"]
json = ["serde", "serde_json"]
[lib]
name = "blog_storage_sqlite_access"
path = "src/lib.rs"

[dependencies]
[dependencies.sqlx-macros]
optional = true
path = "../record-derive"
package = "blog-storage-record-derive"



[dependencies.bytes]
path = "../../encoding/byte-buffer"
package = "blog-encoding-byte-buffer"


[dependencies.chrono]
features = ["clock", "std"]
optional = true
default-features = false
path = "../../format/date-time"
package = "blog-format-date-time"

[dependencies.either]
path = "../../syntax/alternative"
package = "blog-syntax-alternative"

[dependencies.event-listener]
path = "../../sync/notification"
package = "blog-sync-notification"


[dependencies.hashbrown]
path = "../../collections/database-hash-table"
package = "blog-collections-database-hash-table"

[dependencies.hashlink]
path = "../../collections/ordered-cache"
package = "blog-collections-ordered-cache"

[dependencies.indexmap]
path = "../../collections/ordered-map"
package = "blog-collections-ordered-map"

[dependencies.log]
default-features = true
path = "../../diagnostics/event-facade"
package = "blog-diagnostics-event-facade"
features = []
optional = false


[dependencies.serde]
features = ["derive", "rc"]
optional = true
path = "../../format/data-model"
package = "blog-format-data-model"
default-features = true

[dependencies.serde_json]
features = ["raw_value"]
optional = true
path = "../../format/json"
package = "blog-format-json"

[dependencies.smallvec]
path = "../../collections/inline-vector"
package = "blog-collections-inline-vector"

[dependencies.thiserror]
features = ["std"]
default-features = false
path = "../../diagnostics/typed-error"
package = "blog-diagnostics-typed-error"
optional = false

[dependencies.tokio]
features = ["time", "sync", "rt"]
default-features = false
path = "../../runtime/task-scheduler"
package = "blog-runtime-task-scheduler"

[dependencies.flume]
features = ["async"]
default-features = false
path = "../../sync/message-channel"
package = "blog-sync-message-channel"

[dependencies.libsqlite3-sys]
default-features = false
path = "../sqlite-native"
package = "blog-storage-sqlite-native"

[dependencies.futures]
default-features = false
path = "../../runtime/async-toolkit"
package = "blog-runtime-async-toolkit"
features = [
    "alloc",
    "channel",
    "executor",
    "std",
    "utilities",
]

[dependencies.url-encoding]
path = "../../network/web-address"
package = "blog-network-web-address"
features = [
    "form",
    "parser",
    "std",
]
default-features = true

[dependencies.tracing]
features = [
    "attributes",
    "log",
    "std",
]
path = "../../diagnostics/structured-events"
package = "blog-diagnostics-structured-events"
default-features = true


[dependencies.concurrent-collections]
path = "../../sync/concurrent-collections"
package = "blog-sync-concurrent-collections"
default-features = false
features = ["std"]
