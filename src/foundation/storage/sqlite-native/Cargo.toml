[package]
edition = "2021"
name = "blog-storage-sqlite-native"
build = "build.rs"
links = "sqlite3"
exclude = ["**/*.sh"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "sqlite native"
license = "MIT"
publish = false

[features]
with-asan = []

[lib]
name = "blog_storage_sqlite_native"
path = "src/lib.rs"

[build-dependencies.cc]
path = "../../native/c-compiler"
package = "blog-native-c-compiler"
