# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2024"
rust-version = "1.85"
name = "blog-crypto-digest-traits"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "digest traits"
license = "MIT OR Apache-2.0"
publish = false

[features]
alloc = []
block-api = []
default = ["block-api"]
dev = []
mac = ["dep:ctutils"]
oid = ["dep:const-oid"]

[lib]
name = "blog_crypto_digest_traits"
path = "src/lib.rs"

[dependencies.hybrid-array]
path = "../../math/constant-array"
package = "blog-math-constant-array"

[dependencies.const-oid]
optional = true
path = "../algorithm-identifiers"
package = "blog-crypto-algorithm-identifiers"

[dependencies.ctutils]
optional = true
path = "../constant-time-utilities"
package = "blog-crypto-constant-time-utilities"


[lints.clippy]
borrow_as_ptr = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
from_iter_instead_of_collect = "warn"
implicit_saturating_sub = "warn"
manual_assert = "warn"
map_unwrap_or = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
mod_module_files = "warn"
must_use_candidate = "warn"
needless_range_loop = "allow"
ptr_as_ptr = "warn"
redundant_closure_for_method_calls = "warn"
ref_as_ptr = "warn"
return_self_not_must_use = "warn"
semicolon_if_nothing_returned = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
trivially_copy_pass_by_ref = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"

[lints.rust]
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
