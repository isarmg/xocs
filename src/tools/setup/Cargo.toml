[package]
name = "blog-setup"
version = "1.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "离线初始化、账户恢复与实例维护"
build = "../assets/src/platform_contract.rs"

[dependencies]
blog = {  features = ["maintenance"], path = "../../server"}
anyhow = { path = "../../foundation/diagnostics/error-context",package = "blog-diagnostics-error-context"}
clap = {  features = ["derive"], path = "../../foundation/cli/arguments",package = "blog-cli-arguments"}
tokio = {  features = ["macros", "rt-multi-thread"], path = "../../foundation/runtime/task-scheduler",package = "blog-runtime-task-scheduler"}

[lints.rust]
unsafe_code = "deny"
