[package]
name = "blog-assets"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "静态资源编译、源码收据和开发预览"
publish = false
build = "build.rs"
autotests = false

[dependencies]
anyhow = { path = "../../foundation/diagnostics/error-context",package = "blog-diagnostics-error-context"}
memchr = { path = "../../foundation/encoding/byte-search",package = "blog-encoding-byte-search"}
mime_guess = { path = "../../foundation/network/media-detection",package = "blog-network-media-detection"}
regex = { path = "../../foundation/text/pattern-search",package = "blog-text-pattern-search",features = ["matcher"]}
hyper = { default-features = false, features = ["client-legacy", "http1", "tokio"], path = "../../foundation/network/http-transport", package = "blog-network-http-transport" }
serde = {  features = ["derive"], path = "../../foundation/format/data-model",package = "blog-format-data-model"}
serde_json = { path = "../../foundation/format/json",package = "blog-format-json"}
sha2 = { path = "../../foundation/crypto/secure-hash",package = "blog-crypto-secure-hash"}
tempfile = { path = "../../foundation/filesystem/temporary-storage",package = "blog-filesystem-temporary-storage"}
tokio = {  features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"], path = "../../foundation/runtime/task-scheduler",package = "blog-runtime-task-scheduler"}
toml = { path = "../../foundation/format/configuration",package = "blog-format-configuration"}
wasm-bindgen-cli-support = {path = "../../foundation/wasm/browser-module",package = "blog-wasm-browser-module"}

[dependencies.compiler]
package = "blog-assets-compiler"
path = "../../foundation/assets/compiler"
[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"

[build-dependencies.sha2]
path = "../../foundation/crypto/secure-hash"
package = "blog-crypto-secure-hash"

[dependencies.axum]
path = "../../foundation/network/request-router"
package = "blog-network-request-router"
default-features = true

[dependencies.url-encoding]
path = "../../foundation/network/web-address"
package = "blog-network-web-address"
default-features = false
features = [
    "std",
    "parser",
]

[dev-dependencies.tower]
features = [
    "util",
]
path = "../../foundation/network/request-pipeline"
package = "blog-network-request-pipeline"
default-features = true


[dependencies.compression]
path = "../../foundation/encoding/compression"
package = "blog-encoding-compression"
default-features = false
features = ["streams", "simd", "runtime-detection"]

[dependencies.style-compiler]
package = "blog-assets-style-compiler"
path = "../../foundation/assets/style-compiler"

[[test]]
name = "configuration_contracts"
path = "../../../test/tools/assets/integration/configuration_contracts.rs"
