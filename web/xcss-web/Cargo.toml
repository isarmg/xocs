[package]
name = "xocs-web"
version = "0.1.0"
edition = "2024"

[workspace]
exclude = ["vendor/xcss-web"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xcss-web = { path = "vendor/xcss-web", default-features = false, features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
linkify = "=0.11.0"
send_wrapper = "0.6"
gloo-events = "0.2"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "History", "Event", "EventTarget", "SubmitEvent", "HtmlInputElement", "HtmlFormElement", "HtmlSelectElement", "FormData", "AbortController", "AbortSignal", "Crypto", "Storage", "HtmlDialogElement", "HtmlTextAreaElement", "HtmlImageElement", "HtmlMediaElement", "HtmlVideoElement", "HtmlAudioElement", "File", "FileList", "Blob", "Url", "UrlSearchParams", "ScrollToOptions", "ScrollBehavior", "Clipboard", "Navigator", "DomRect", "KeyboardEvent", "NodeList", "Element", "HtmlElement", "MutationObserver", "MutationObserverInit", "ValidityState", "ResizeObserver", "FontFaceSet", "HtmlAnchorElement", "DomTokenList"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies.chrono]
version = "=0.4.45"
default-features = false
features = ["std"]

[dependencies.regex]
version = "1"
default-features = false
features = ["std", "unicode-case", "perf"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
url = "=2.5.8"
